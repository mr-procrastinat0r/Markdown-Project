<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Notes</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">◇</span>
        <h1>Markdown Notes</h1>
      </div>
      <div class="header-actions">
        <button type="button" id="btn-new" class="btn btn-ghost">New</button>
        <button type="button" id="btn-save" class="btn btn-primary">Save</button>
        <button type="button" id="btn-grammar" class="btn btn-secondary">Check grammar</button>
        <label class="btn btn-ghost upload-label">
          Upload .md
          <input type="file" id="file-upload" accept=".md,.markdown,text/markdown,text/plain" hidden>
        </label>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2>Saved notes</h2>
          <button type="button" id="btn-refresh" class="btn-icon" title="Refresh list" aria-label="Refresh">↻</button>
        </div>
        <ul id="notes-list" class="notes-list"></ul>
        <p id="notes-empty" class="notes-empty hidden">No notes yet. Create one or upload a file.</p>
      </aside>

      <main class="editor-panel">
        <input type="text" id="note-title" class="title-input" placeholder="Note title" autocomplete="off">
        <textarea id="note-content" class="content-input" placeholder="Write Markdown here…" spellcheck="true"></textarea>
        <p id="editor-status" class="editor-status"></p>
      </main>

      <section class="preview-panel">
        <div class="panel-tabs">
          <button type="button" class="tab active" data-tab="preview">Preview</button>
          <button type="button" class="tab" data-tab="grammar">Grammar</button>
        </div>
        <div id="tab-preview" class="tab-pane active">
          <article id="preview" class="preview-content prose"></article>
        </div>
        <div id="tab-grammar" class="tab-pane">
          <div id="grammar-results" class="grammar-results">
            <p class="grammar-hint">Run a grammar check on the current note content.</p>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/js/app.js"></script>
</body>
</html>
